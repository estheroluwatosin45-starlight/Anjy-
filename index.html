<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ANJY</title>
    
    <!-- PWA Meta tags -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#6D28D9" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/icon-512.png" />

    <!-- Instant Preloader Styling -->
    <style>
      #preloader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: linear-gradient(135deg, #111827 0%, #1f1137 100%);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 999999;
        transition: opacity 0.5s ease, visibility 0.5s ease;
      }
      .preloader-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.5rem;
      }
      .preloader-logo {
        font-family: Georgia, serif;
        font-size: 5rem;
        font-weight: bold;
        color: transparent;
        background: linear-gradient(135deg, #F59E0B 0%, #D97706 100%);
        -webkit-background-clip: text;
        background-clip: text;
        text-shadow: 0 0 35px rgba(245, 158, 11, 0.2);
        animation: pulse-glow 2s infinite ease-in-out;
      }
      .preloader-spinner {
        width: 32px;
        height: 32px;
        border: 2px solid rgba(109, 40, 217, 0.15);
        border-top-color: #a78bfa;
        border-radius: 50%;
        animation: spin 0.8s infinite linear;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      @keyframes pulse-glow {
        0%, 100% {
          opacity: 0.85;
          transform: scale(0.96);
        }
        50% {
          opacity: 1;
          transform: scale(1.04);
          text-shadow: 0 0 45px rgba(245, 158, 11, 0.35);
        }
      }
      #preloader.preloader-fade-out {
        opacity: 0;
        visibility: hidden;
      }
    </style>
  </head>
  <body>
    <!-- Preloader Overlay -->
    <div id="preloader">
      <div class="preloader-content">
        <div class="preloader-logo">A</div>
        <div class="preloader-spinner"></div>
      </div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <!-- Service Worker Registration -->
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js')
            .then((reg) => console.log('PWA Service Worker registered successfully:', reg.scope))
            .catch((err) => console.warn('PWA Service Worker registration failed:', err));
        });
      }
    </script>
  </body>
</html>
